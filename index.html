<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <link rel="stylesheet" href="styles.css">
    <title>Reading Log</title>
  </head>
  <body>
    <header>
      <h1>Local Reading Log</h1>
      <button id="add_button" class="btn btn-primary">Add Book</button>
    </header>
    <template id="book_template">
      <li class="book_card" value="title">Title</li>
            <li class="book_trait" value="author">By Author</li>
            <li class="book_trait" value="genre">By Author</li>
            <li class="book_trait" value="isbn">By Author</li>
    </template>
    <main id="main_frame"> 
      <div id="book_div">
        <ul id="book_list">
          <li class="book_card" value="title">Title
            <ul>
              <li class="book_cover_item">
                <img class = "book_cover" src="https://media.istockphoto.com/id/1147544807/vector/thumbnail-image-vector-graphic.jpg?s=612x612&w=0&k=20&c=rnCKVbdxqkjlcs3xH87-9gocETqpspHFXu5dIGB4wuM=
                "alt="Book cover"></img>
              </li>
              <li class="book_trait" value="author">Authors -</li>
              <li class="book_trait" value="genre">Genres -</li>
            </ul>
          </li>
            
          <li class="book_card" value="title">Title</li>
        </ul>
        
      </div>
    </main>
    <div class="bottom_bar">
      <search id="search_bar">
        <label>
          Search for a book.
          <input type="search" id="query" />
        </label>
        <select id = "search_filter">
          <option value="title" selected>Title</option>
          <option value="author">Author</option>
          <option value="genre">Genre</option>
          <option value="isbn">ISBN</option>
        </select>
      </search>
      
    </div>

    <!-- Optional JavaScript; choose one of the two! -->

    <!-- Option 1: Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>

    
  </body>
</html>
